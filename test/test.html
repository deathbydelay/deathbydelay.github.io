<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Test Page for color swatches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    table {
      width: 50%;
    }

    td, th {
      border-radius: 25px;
      padding: 12px;
      text-align: center;
      font-weight: 600;
      width: 50px;
      height: 50px;
      border: 1px solid white;
    }
    th {
      background-color: darkgray;
    }
    .swatch-1a {
      background-color: var(--base);
      color: black;
    }
    .swatch-1b {
      background-color: var(--new-base);
      color: black;
    }
    .swatch-2a {
      background-color: var(--accent);
      color: black;
    }
    .swatch-2b {
      background-color: var(--new-accent);
      color: black;
    }
    .swatch-3a {
      background-color: var(--bg);
      color: white;
    }
    .swatch-3b {
      background-color: var(--new-bg);
      color: white;
    }
    .swatch-4a {
      background-color: var(--bg-card);
      color: white;
    }
    .swatch-4b {
      background-color: var(--new-bg-card);
      color: white;
    }
    .swatch-5a {
      background-color: var(--bg-line);
      color: white;
    }
    .swatch-5b {
      background-color: var(--new-bg-line);
      color: white;
    }
    .swatch-6a {
      background-color: var(--text);
      color: black;
    }
    .swatch-6b {
      background-color: var(--new-text);
      color: black;
    }
    .swatch-7a {
      background-color: var(--text-muted);
      color: black;
    }
    .swatch-7b {
      background-color: var(--new-text-muted);
      color: black;
    }
    .swatch-8a {
      background-color: var(--rule);
      color: black;
    }
    .swatch-8b {
      background-color: var(--new-rule);
      color: black;
    }
  </style>
</head>
<body>
<table>
  <tr>
    <th>Original</th>
    <th>New</th>
  </tr>
  <tr>
    <td class="swatch-1a">Accent</td>
    <td class="swatch-1b">Base</td>
  </tr>
  <tr>
    <td class="swatch-2a">Accent2</td>
    <td class="swatch-2b">New Accent</td>
  </tr>
  <tr>
    <td class="swatch-3a">BG</td>
    <td class="swatch-3b">New BG</td>
  </tr>
  <tr>
    <td class="swatch-4a">BG-Card</td>
    <td class="swatch-4b">New BG-Card</td>
  </tr>
  <tr>
    <td class="swatch-5a">BG-Line</td>
    <td class="swatch-5b">New BG-Line</td>
  </tr>
  <tr>
    <td class="swatch-6a">Text</td>
    <td class="swatch-6b">New Text</td>
  </tr>
  <tr>
    <td class="swatch-7a">Text-Muted</td>
    <td class="swatch-7b">New Text-Muted</td>
  </tr>
  <tr>
    <td class="swatch-8a">Rule</td>
    <td class="swatch-8b">New Rule</td>
  </tr>
</table>
</body>
</html>
